<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meridian University — Admission Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:#fff;height:100vh;display:flex;flex-direction:column;color:#111;}
    .topbar{padding:16px 24px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
    .topbar-left{display:flex;align-items:center;gap:12px;}
    .top-logo{width:32px;height:32px;background:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:14px;font-weight:600;}
    .top-title{font-size:14px;font-weight:600;color:#111;}
    .top-sub{font-size:12px;color:#999;margin-top:1px;}
    .top-badge{font-size:11px;color:#16a34a;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:20px;padding:4px 10px;display:flex;align-items:center;gap:5px;}
    .top-badge-dot{width:6px;height:6px;background:#22c55e;border-radius:50%;}
    .messages{flex:1;overflow-y:auto;padding:32px 24px;display:flex;flex-direction:column;gap:24px;max-width:780px;width:100%;margin:0 auto;}
    .messages::-webkit-scrollbar{width:0;}
    .msg-row{display:flex;gap:12px;align-items:flex-start;}
    .msg-row.user{flex-direction:row-reverse;}
    .msg-av{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;margin-top:2px;}
    .bot-av{background:#111;color:#fff;}
    .user-av{background:#f4f4f4;color:#555;}
    .msg-body{max-width:80%;}
    .msg-name{font-size:11px;font-weight:500;color:#999;margin-bottom:6px;}
    .msg-row.user .msg-name{text-align:right;}
    .msg-text{font-size:14px;line-height:1.65;color:#111;white-space:pre-wrap;}
    .msg-row.user .msg-text{color:#111;text-align:left;}
    .msg-bubble{background:#f9f9f9;border-radius:12px;border-radius:2px 12px 12px 12px;padding:14px 16px;}
    .msg-row.user .msg-bubble{background:#111;border-radius:12px 2px 12px 12px;}
    .msg-row.user .msg-text{color:#fff;}
    .msg-time{font-size:11px;color:#ccc;margin-top:5px;}
    .msg-row.user .msg-time{text-align:right;}
    .suggestions{max-width:780px;width:100%;margin:0 auto;padding:0 24px 16px;display:flex;flex-wrap:wrap;gap:6px;}
    .sug-btn{font-size:12px;font-family:'Inter',sans-serif;padding:7px 14px;border:1px solid #e5e5e5;border-radius:20px;background:#fff;color:#555;cursor:pointer;transition:all 0.15s;}
    .sug-btn:hover{background:#111;color:#fff;border-color:#111;}
    .input-area{border-top:1px solid #f0f0f0;padding:16px 24px;flex-shrink:0;}
    .input-inner{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;background:#f9f9f9;border:1px solid #e5e5e5;border-radius:12px;padding:10px 14px;transition:border-color 0.15s;}
    .input-inner:focus-within{border-color:#111;background:#fff;}
    input{flex:1;border:none;background:transparent;font-size:14px;font-family:'Inter',sans-serif;color:#111;outline:none;}
    input::placeholder{color:#bbb;}
    .send{width:32px;height:32px;background:#111;border:none;border-radius:8px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:opacity 0.15s;flex-shrink:0;}
    .send:hover{opacity:0.75;}
    .typing-dots span{display:inline-block;width:6px;height:6px;background:#ccc;border-radius:50%;margin:0 2px;animation:bounce 1.2s infinite;}
    .typing-dots span:nth-child(2){animation-delay:0.2s;}
    .typing-dots span:nth-child(3){animation-delay:0.4s;}
    @keyframes bounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-6px);}}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <div class="top-logo">M</div>
      <div>
        <div class="top-title">Meridian University</div>
        <div class="top-sub">Admission Assistant · Gemini 2.5 Flash</div>
      </div>
    </div>
    <div class="top-badge"><div class="top-badge-dot"></div>Online</div>
  </div>

  <div class="messages" id="messages">
    <div class="msg-row">
      <div class="msg-av bot-av">M</div>
      <div class="msg-body">
        <div class="msg-name">Meridian Assistant</div>
        <div class="msg-bubble"><div class="msg-text">Hi! I'm the Meridian University admission assistant.

I can help you with:
· Application status checks
· Programme details & fees
· Intake dates & entry requirements

How can I help you today?</div></div>
        <div class="msg-time">Just now</div>
      </div>
    </div>
  </div>

  <div class="suggestions">
    <button class="sug-btn" onclick="ask('What programmes do you offer?')">Programmes offered</button>
    <button class="sug-btn" onclick="ask('What is the fee for Bachelor of Computer Science?')">Computer Science fees</button>
    <button class="sug-btn" onclick="ask('What are the intake dates?')">Intake dates</button>
    <button class="sug-btn" onclick="ask('Check my application status. My ref no is MUM2603')">Check my status</button>
  </div>

  <div class="input-area">
    <div class="input-inner">
      <input type="text" id="userInput" placeholder="Ask about admissions, programmes, or your application..." onkeydown="if(event.key==='Enter')sendMessage()"/>
      <button class="send" onclick="sendMessage()">↑</button>
    </div>
  </div>

  <script>
    function getTime(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
    async function sendMessage(){
      const input=document.getElementById('userInput');
      const message=input.value.trim();
      if(!message)return;
      addMessage(message,'user');
      input.value='';
      addTyping();
      try{
        const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});
        const data=await res.json();
        removeTyping();
        addMessage(data.response,'bot');
      }catch{
        removeTyping();
        addMessage('Sorry, something went wrong. Please try again.','bot');
      }
    }
    function ask(text){document.getElementById('userInput').value=text;sendMessage();}
    function addMessage(text,sender){
      const messages=document.getElementById('messages');
      const row=document.createElement('div');
      row.className='msg-row '+(sender==='user'?'user':'');
      const av=document.createElement('div');
      av.className='msg-av '+(sender==='user'?'user-av':'bot-av');
      av.textContent=sender==='user'?'You':'M';
      const body=document.createElement('div');
      body.className='msg-body';
      const name=document.createElement('div');
      name.className='msg-name';
      name.textContent=sender==='user'?'You':'Meridian Assistant';
      const bubble=document.createElement('div');
      bubble.className='msg-bubble';
      const txt=document.createElement('div');
      txt.className='msg-text';
      txt.textContent=text;
      const time=document.createElement('div');
      time.className='msg-time';
      time.textContent=getTime();
      bubble.appendChild(txt);
      body.appendChild(name);
      body.appendChild(bubble);
      body.appendChild(time);
      row.appendChild(av);
      row.appendChild(body);
      messages.appendChild(row);
      messages.scrollTop=messages.scrollHeight;
    }
    function addTyping(){
      const messages=document.getElementById('messages');
      const row=document.createElement('div');
      row.className='msg-row';
      row.id='typing';
      const av=document.createElement('div');
      av.className='msg-av bot-av';
      av.textContent='M';
      const body=document.createElement('div');
      body.className='msg-body';
      const bubble=document.createElement('div');
      bubble.className='msg-bubble';
      bubble.innerHTML='<div class="typing-dots"><span></span><span></span><span></span></div>';
      body.appendChild(bubble);
      row.appendChild(av);
      row.appendChild(body);
      messages.appendChild(row);
      messages.scrollTop=messages.scrollHeight;
    }
    function removeTyping(){document.getElementById('typing')?.remove();}
  </script>
</body>
</html>
